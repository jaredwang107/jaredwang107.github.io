<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator — Free Scientific Calculator</title>
  <meta name="description" content="Free scientific calculator by Web Gadgets. Trig, logs, powers, roots, memory, constants. No sign-up, no ads.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Cpath d='M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32' fill='none' stroke='%2300e5ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M42 40 L50 32 L52 32' fill='none' stroke='%237c3aed' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%2300e5ff'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --card: #1a1a26; --border: #2a2a3a;
      --accent: #00e5ff; --accent2: #7c3aed; --text: #e8e8f0; --muted: #6b6b88;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999; opacity: 0.5;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text);
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent); }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 7px; overflow: hidden;
      border: 1px solid rgba(0,229,255,0.25); flex-shrink: 0;
    }
    .logo-mark svg { width: 100%; height: 100%; display: block; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.78rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }

    .main {
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem 3rem; position: relative; z-index: 1;
    }
    .hero-label {
      font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.5rem;
    }
    .page-title {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.03em;
      margin-bottom: 0.4rem; text-align: center;
    }
    .page-sub {
      font-size: 0.78rem; color: var(--muted); margin-bottom: 1.5rem;
      text-align: center; max-width: 42ch; line-height: 1.55;
    }

    .calc-wrap {
      width: 100%; max-width: 520px;
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .display {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.9rem 1rem; margin-bottom: 0.75rem; min-height: 78px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 0.2rem;
    }
    .expr { font-size: 0.72rem; color: var(--muted); min-height: 1em; word-break: break-all; text-align: right; width: 100%; }
    .result {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.85rem;
      letter-spacing: -0.03em; color: var(--text); word-break: break-all;
      text-align: right; width: 100%; line-height: 1.1;
    }
    .mem-bar {
      display: flex; gap: 0.4rem; margin-bottom: 0.65rem; flex-wrap: wrap;
    }
    .mem-pill {
      font-size: 0.62rem; color: var(--muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 100px; padding: 0.2rem 0.55rem;
    }
    .mem-pill.on { color: var(--accent); border-color: rgba(0,229,255,0.35); }

    .mode-bar {
      display: flex; gap: 0.4rem; margin-bottom: 0.65rem;
    }
    .mode-btn {
      flex: 1; padding: 0.4rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-family: 'DM Mono', monospace;
      font-size: 0.7rem; cursor: pointer; transition: all 0.15s;
    }
    .mode-btn.active {
      color: #000; background: var(--accent); border-color: var(--accent); font-weight: 600;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.4rem;
    }

    .key {
      appearance: none; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.82rem;
      font-weight: 500; border-radius: 8px; padding: 0.72rem 0.15rem;
      cursor: pointer; transition: background 0.12s, border-color 0.12s, transform 0.08s, color 0.12s;
      user-select: none; line-height: 1.1;
    }
    .key:hover { border-color: rgba(0,229,255,0.35); background: #1e1e2a; }
    .key:active { transform: scale(0.96); }
    .key.op { color: var(--accent); border-color: rgba(0,229,255,0.18); background: rgba(0,229,255,0.05); }
    .key.op:hover { background: rgba(0,229,255,0.12); }
    .key.fn { color: #a78bfa; font-size: 0.72rem; }
    .key.fn:hover { border-color: rgba(124,58,237,0.4); }
    .key.mem { color: #f59e0b; font-size: 0.72rem; }
    .key.util { color: var(--muted); font-size: 0.72rem; }
    .key.equals {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; color: #fff; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
    }
    .key.equals:hover { opacity: 0.92; border: none; }
    .key.span2 { grid-column: span 2; }
    .key.num { font-size: 0.95rem; }

    .hint {
      margin-top: 1rem; font-size: 0.65rem; color: var(--muted); text-align: center;
    }

    footer {
      text-align: center; padding: 1.25rem; font-size: 0.7rem; color: var(--muted);
      border-top: 1px solid var(--border); position: relative; z-index: 1;
    }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 480px) {
      .keys { gap: 0.3rem; }
      .key { padding: 0.6rem 0.1rem; font-size: 0.72rem; }
      .key.fn, .key.mem, .key.util { font-size: 0.62rem; }
      .result { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="/">
      <div class="logo-mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
          <path d="M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M42 40 L50 32 L52 32" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="52" cy="32" r="4" fill="#00e5ff"/>
        </svg>
      </div>
      Web<span>Gadgets</span>
    </a>
    <div class="nav-links">
      <a href="/">All tools</a>
      <a href="mailto:jaredwang107@gmail.com">Contact</a>
    </div>
  </nav>

  <main class="main">
    <div class="hero-label">Free online tool</div>
    <h1 class="page-title">Calculator</h1>
    <p class="page-sub">Scientific calculator with trig, logs, powers, roots, constants, memory, and more.</p>

    <div class="calc-wrap">
      <div class="display">
        <div class="expr" id="expr"></div>
        <div class="result" id="result">0</div>
      </div>

      <div class="mem-bar">
        <span class="mem-pill" id="memInd">M: 0</span>
        <span class="mem-pill" id="angInd">DEG</span>
      </div>

      <div class="mode-bar">
        <button class="mode-btn active" id="degBtn" type="button">DEG</button>
        <button class="mode-btn" id="radBtn" type="button">RAD</button>
      </div>

      <div class="keys" id="keys">
        <!-- Row 1: Memory + clear -->
        <button class="key mem" data-act="mc">MC</button>
        <button class="key mem" data-act="mr">MR</button>
        <button class="key mem" data-act="mplus">M+</button>
        <button class="key mem" data-act="mminus">M−</button>
        <button class="key mem" data-act="ms">MS</button>
        <button class="key util" data-act="clear">AC</button>

        <!-- Row 2: constants & util -->
        <button class="key fn" data-act="pi">π</button>
        <button class="key fn" data-act="e">e</button>
        <button class="key fn" data-act="rand">Rand</button>
        <button class="key util" data-act="sign">+/−</button>
        <button class="key util" data-act="percent">%</button>
        <button class="key util" data-act="back">⌫</button>

        <!-- Row 3: parentheses & powers -->
        <button class="key fn" data-act="lparen">(</button>
        <button class="key fn" data-act="rparen">)</button>
        <button class="key fn" data-act="pow">xʸ</button>
        <button class="key fn" data-act="square">x²</button>
        <button class="key fn" data-act="cube">x³</button>
        <button class="key op" data-op="/">÷</button>

        <!-- Row 4: roots & exp -->
        <button class="key fn" data-act="sqrt">√</button>
        <button class="key fn" data-act="cbrt">∛</button>
        <button class="key fn" data-act="inv">1/x</button>
        <button class="key fn" data-act="exp10">10ˣ</button>
        <button class="key fn" data-act="exp">eˣ</button>
        <button class="key op" data-op="*">×</button>

        <!-- Row 5: logs -->
        <button class="key fn" data-act="ln">ln</button>
        <button class="key fn" data-act="log">log</button>
        <button class="key fn" data-act="log2">log₂</button>
        <button class="key fn" data-act="fact">n!</button>
        <button class="key fn" data-act="abs">|x|</button>
        <button class="key op" data-op="-">−</button>

        <!-- Row 6: trig -->
        <button class="key fn" data-act="sin">sin</button>
        <button class="key fn" data-act="cos">cos</button>
        <button class="key fn" data-act="tan">tan</button>
        <button class="key fn" data-act="asin">sin⁻¹</button>
        <button class="key fn" data-act="acos">cos⁻¹</button>
        <button class="key op" data-op="+">+</button>

        <!-- Row 7: more trig + hyp -->
        <button class="key fn" data-act="sinh">sinh</button>
        <button class="key fn" data-act="cosh">cosh</button>
        <button class="key fn" data-act="tanh">tanh</button>
        <button class="key fn" data-act="asinh">sinh⁻¹</button>
        <button class="key fn" data-act="acosh">cosh⁻¹</button>
        <button class="key fn" data-act="atanh">tanh⁻¹</button>

        <!-- Row 8: numbers -->
        <button class="key num" data-num="7">7</button>
        <button class="key num" data-num="8">8</button>
        <button class="key num" data-num="9">9</button>
        <button class="key fn" data-act="floor">⌊x⌋</button>
        <button class="key fn" data-act="ceil">⌈x⌉</button>
        <button class="key fn" data-act="round">rnd</button>

        <!-- Row 9 -->
        <button class="key num" data-num="4">4</button>
        <button class="key num" data-num="5">5</button>
        <button class="key num" data-num="6">6</button>
        <button class="key fn" data-act="mod">mod</button>
        <button class="key fn" data-act="hypot">hypot</button>
        <button class="key fn" data-act="atan2">atan2</button>

        <!-- Row 10 -->
        <button class="key num" data-num="1">1</button>
        <button class="key num" data-num="2">2</button>
        <button class="key num" data-num="3">3</button>
        <button class="key fn" data-act="deg2rad">→rad</button>
        <button class="key op" data-op="+">+</button>
        <button class="key equals" data-act="equals">=</button>

        <!-- Row 11 -->
        <button class="key num" data-num="0">0</button>
        <button class="key num" data-num="00">00</button>
        <button class="key" data-act="dot">.</button>
        <button class="key fn" data-act="ee">EE</button>
        <button class="key fn" data-act="ans">Ans</button>
        <button class="key util" data-act="clearentry">CE</button>
      </div>
    </div>
    <p class="hint">Keyboard · numbers · operators · Enter · Esc · Backspace</p>
  </main>

  <footer>
    <a href="/">WebGadgets</a> · Free tools, no ads
  </footer>

  <script>
  (() => {
    const exprEl = document.getElementById('expr');
    const resultEl = document.getElementById('result');
    const memInd = document.getElementById('memInd');
    const angInd = document.getElementById('angInd');
    const degBtn = document.getElementById('degBtn');
    const radBtn = document.getElementById('radBtn');

    let current = '0';
    let previous = null;
    let operator = null;
    let fresh = true;
    let memory = 0;
    let lastAns = 0;
    let angleMode = 'DEG'; // DEG | RAD
    let pendingBinary = null; // for mod, hypot, atan2, pow

    const OP_SYM = { '+': '+', '-': '−', '*': '×', '/': '÷', 'mod': 'mod', 'pow': '^', 'hypot': 'hypot', 'atan2': 'atan2' };

    function toRad(x) { return angleMode === 'DEG' ? x * Math.PI / 180 : x; }
    function fromRad(x) { return angleMode === 'DEG' ? x * 180 / Math.PI : x; }

    function format(n) {
      if (n === null || n === undefined) return '0';
      if (!isFinite(n)) return 'Error';
      if (Object.is(n, -0)) n = 0;
      let s = String(n);
      if (Math.abs(n) >= 1e12 || (Math.abs(n) > 0 && Math.abs(n) < 1e-9)) {
        s = n.toExponential(8).replace(/\.?0+e/, 'e').replace(/e\+/, 'e');
      } else if (s.includes('.') && s.length > 14) {
        s = parseFloat(n.toPrecision(12)).toString();
      }
      return s;
    }

    function update() {
      resultEl.textContent = current;
      if (previous !== null && operator) {
        exprEl.textContent = format(previous) + ' ' + (OP_SYM[operator] || operator);
      } else {
        exprEl.textContent = '';
      }
      memInd.textContent = 'M: ' + format(memory);
      memInd.classList.toggle('on', memory !== 0);
      angInd.textContent = angleMode;
    }

    function setCurrent(n) {
      current = format(n);
      fresh = true;
      update();
    }

    function getVal() { return parseFloat(current); }

    function inputNum(d) {
      if (fresh) { current = d === '.' ? '0.' : d; fresh = false; }
      else {
        if (d === '.' && current.includes('.')) return;
        if (current === '0' && d !== '.') current = d;
        else if (current.length < 20) current += d;
      }
      update();
    }

    function applyUnary(fn, label) {
      const v = getVal();
      const r = fn(v);
      exprEl.textContent = (label || '') + '(' + format(v) + ')';
      current = format(r);
      lastAns = isFinite(r) ? r : lastAns;
      fresh = true;
      resultEl.textContent = current;
    }

    function setOp(op) {
      const val = getVal();
      if (previous !== null && operator && !fresh) {
        const r = compute(previous, val, operator);
        previous = r;
        current = format(r);
      } else {
        previous = val;
      }
      operator = op;
      fresh = true;
      update();
    }

    function compute(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? NaN : a / b;
        case 'mod': return b === 0 ? NaN : ((a % b) + b) % b;
        case 'pow': return Math.pow(a, b);
        case 'hypot': return Math.hypot(a, b);
        case 'atan2': return fromRad(Math.atan2(a, b));
        default: return b;
      }
    }

    function equals() {
      if (operator === null || previous === null) return;
      const val = getVal();
      const r = compute(previous, val, operator);
      exprEl.textContent = format(previous) + ' ' + (OP_SYM[operator] || operator) + ' ' + format(val) + ' =';
      current = format(r);
      lastAns = isFinite(r) ? r : lastAns;
      previous = null;
      operator = null;
      fresh = true;
      resultEl.textContent = current;
    }

    function factorial(n) {
      if (n < 0 || !Number.isInteger(n)) return NaN;
      if (n > 170) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }

    function clearAll() {
      current = '0'; previous = null; operator = null; fresh = true; update();
    }

    function clearEntry() {
      current = '0'; fresh = true; update();
    }

    function backspace() {
      if (fresh) return;
      if (current.length <= 1 || (current.length === 2 && current.startsWith('-'))) current = '0';
      else current = current.slice(0, -1);
      if (current === '-' || current === '') current = '0';
      update();
    }

    const actions = {
      clear: clearAll,
      clearentry: clearEntry,
      back: backspace,
      sign: () => {
        if (current === '0' || current === 'Error') return;
        current = current.startsWith('-') ? current.slice(1) : '-' + current;
        update();
      },
      percent: () => setCurrent(getVal() / 100),
      dot: () => inputNum('.'),
      equals,
      pi: () => setCurrent(Math.PI),
      e: () => setCurrent(Math.E),
      rand: () => setCurrent(Math.random()),
      ans: () => setCurrent(lastAns),
      square: () => applyUnary(x => x * x, 'sq'),
      cube: () => applyUnary(x => x * x * x, 'cube'),
      sqrt: () => applyUnary(Math.sqrt, '√'),
      cbrt: () => applyUnary(Math.cbrt, '∛'),
      inv: () => applyUnary(x => x === 0 ? NaN : 1 / x, '1/'),
      exp: () => applyUnary(Math.exp, 'e^'),
      exp10: () => applyUnary(x => Math.pow(10, x), '10^'),
      ln: () => applyUnary(Math.log, 'ln'),
      log: () => applyUnary(Math.log10, 'log'),
      log2: () => applyUnary(Math.log2, 'log2'),
      fact: () => applyUnary(x => factorial(Math.round(x)), 'n!'),
      abs: () => applyUnary(Math.abs, 'abs'),
      floor: () => applyUnary(Math.floor, 'floor'),
      ceil: () => applyUnary(Math.ceil, 'ceil'),
      round: () => applyUnary(Math.round, 'round'),
      sin: () => applyUnary(x => Math.sin(toRad(x)), 'sin'),
      cos: () => applyUnary(x => Math.cos(toRad(x)), 'cos'),
      tan: () => applyUnary(x => Math.tan(toRad(x)), 'tan'),
      asin: () => applyUnary(x => fromRad(Math.asin(x)), 'sin⁻¹'),
      acos: () => applyUnary(x => fromRad(Math.acos(x)), 'cos⁻¹'),
      atan: () => applyUnary(x => fromRad(Math.atan(x)), 'tan⁻¹'),
      sinh: () => applyUnary(Math.sinh, 'sinh'),
      cosh: () => applyUnary(Math.cosh, 'cosh'),
      tanh: () => applyUnary(Math.tanh, 'tanh'),
      asinh: () => applyUnary(Math.asinh, 'sinh⁻¹'),
      acosh: () => applyUnary(Math.acosh, 'cosh⁻¹'),
      atanh: () => applyUnary(Math.atanh, 'tanh⁻¹'),
      deg2rad: () => setCurrent(getVal() * Math.PI / 180),
      rad2deg: () => setCurrent(getVal() * 180 / Math.PI),
      pow: () => setOp('pow'),
      mod: () => setOp('mod'),
      hypot: () => setOp('hypot'),
      atan2: () => setOp('atan2'),
      ee: () => {
        if (fresh) { current = '1e'; fresh = false; }
        else if (!/[eE]/.test(current)) current += 'e';
        update();
      },
      mc: () => { memory = 0; update(); },
      mr: () => setCurrent(memory),
      mplus: () => { memory += getVal(); update(); },
      mminus: () => { memory -= getVal(); update(); },
      ms: () => { memory = getVal(); update(); },
      lparen: () => {},
      rparen: () => {},
    };

    document.getElementById('keys').addEventListener('click', (e) => {
      const btn = e.target.closest('.key');
      if (!btn) return;
      if (btn.dataset.num !== undefined) inputNum(btn.dataset.num);
      else if (btn.dataset.op) setOp(btn.dataset.op);
      else if (btn.dataset.act && actions[btn.dataset.act]) actions[btn.dataset.act]();
    });

    degBtn.addEventListener('click', () => {
      angleMode = 'DEG';
      degBtn.classList.add('active');
      radBtn.classList.remove('active');
      update();
    });
    radBtn.addEventListener('click', () => {
      angleMode = 'RAD';
      radBtn.classList.add('active');
      degBtn.classList.remove('active');
      update();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') { inputNum(e.key); e.preventDefault(); }
      else if (e.key === '.') { inputNum('.'); e.preventDefault(); }
      else if (e.key === '+') { setOp('+'); e.preventDefault(); }
      else if (e.key === '-') { setOp('-'); e.preventDefault(); }
      else if (e.key === '*' || e.key === 'x') { setOp('*'); e.preventDefault(); }
      else if (e.key === '/') { setOp('/'); e.preventDefault(); }
      else if (e.key === 'Enter' || e.key === '=') { equals(); e.preventDefault(); }
      else if (e.key === 'Escape') { clearAll(); e.preventDefault(); }
      else if (e.key === 'Backspace') { backspace(); e.preventDefault(); }
      else if (e.key === '%') { actions.percent(); e.preventDefault(); }
    });

    update();
  })();
  </script>
</body>
</html>
