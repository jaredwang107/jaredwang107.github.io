<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch — Advanced Laps & Splits</title>
<meta name="description" content="Free advanced stopwatch with laps, splits, and millisecond precision.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Cpath d='M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32' fill='none' stroke='%2300e5ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%2300e5ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3a;--accent:#00e5ff;--accent2:#7c3aed;--text:#e8e8f0;--muted:#6b6b88;--danger:#ef4444;--ok:#10b981}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem}
.logo span{color:var(--accent)}
.logo-mark{width:28px;height:28px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,229,255,.25)}
.logo-mark svg{width:100%;height:100%}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.78rem;margin-left:1.25rem}
.main{max-width:480px;margin:0 auto;padding:2.5rem 1.25rem 3rem;position:relative;z-index:1;text-align:center}
.hero-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:.35rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:1.75rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem}
.time{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.5rem,10vw,3.4rem);letter-spacing:-.03em;color:var(--accent);margin:1rem 0 1.5rem;font-variant-numeric:tabular-nums}
.ms{font-size:.45em;opacity:.7}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:1.25rem}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.85rem;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer}
.btn:hover{border-color:rgba(0,229,255,.4)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff}
.btn.danger{color:var(--danger);border-color:rgba(239,68,68,.3)}
.laps{max-height:240px;overflow:auto;text-align:left}
.lap{display:flex;justify-content:space-between;padding:.5rem .65rem;border-bottom:1px solid var(--border);font-size:.8rem}
.lap:last-child{border-bottom:none}
.lap-n{color:var(--muted)}
.lap-best{color:var(--ok)}
.lap-worst{color:var(--danger)}
footer{text-align:center;padding:1.25rem;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0f"/><path d="M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="32" r="4" fill="#00e5ff"/></svg></div>Web<span>Gadgets</span></a>
  <div class="nav-links"><a href="/tools.html">Tools</a><a href="mailto:jaredwang107@gmail.com">Contact</a></div>
</nav>
<main class="main">
  <div class="hero-label">Free online tool</div>
  <h1>Stopwatch</h1>
  <p class="sub">Millisecond precision with laps and split times.</p>
  <div class="panel">
    <div class="time" id="display">00:00:00<span class="ms">.000</span></div>
    <div class="btns">
      <button class="btn danger" id="reset">Reset</button>
      <button class="btn primary" id="toggle">Start</button>
      <button class="btn" id="lap">Lap</button>
    </div>
    <div class="laps" id="laps"></div>
  </div>
</main>
<footer><a href="/tools.html">All tools</a> · WebGadgets</footer>
<script>
let start=0, elapsed=0, timer=null, running=false, laps=[];
const display=document.getElementById('display'), lapsEl=document.getElementById('laps');
function fmt(ms){
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000), s=Math.floor((ms%60000)/1000), milli=ms%1000;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}<span class="ms">.${String(milli).padStart(3,'0')}</span>`;
}
function tick(){ display.innerHTML=fmt(elapsed+(Date.now()-start)); }
document.getElementById('toggle').onclick=()=>{
  if(!running){ start=Date.now(); timer=setInterval(tick,16); running=true; document.getElementById('toggle').textContent='Pause'; }
  else{ elapsed+=Date.now()-start; clearInterval(timer); running=false; document.getElementById('toggle').textContent='Start'; display.innerHTML=fmt(elapsed); }
};
document.getElementById('reset').onclick=()=>{
  clearInterval(timer); running=false; start=0; elapsed=0; laps=[]; document.getElementById('toggle').textContent='Start';
  display.innerHTML=fmt(0); lapsEl.innerHTML='';
};
document.getElementById('lap').onclick=()=>{
  const t=running?elapsed+(Date.now()-start):elapsed;
  if(t===0) return;
  const prev=laps.length?laps[laps.length-1].t:0;
  laps.push({t, split:t-prev});
  renderLaps();
};
function renderLaps(){
  const splits=laps.map(l=>l.split);
  const best=Math.min(...splits), worst=Math.max(...splits);
  lapsEl.innerHTML=laps.map((l,i)=>{
    let cls=''; if(splits.length>1){ if(l.split===best) cls='lap-best'; if(l.split===worst) cls='lap-worst'; }
    return `<div class="lap"><span class="lap-n">Lap ${i+1}</span><span class="${cls}">${fmt(l.split).replace(/<[^>]+>/g,'')} · Σ ${fmt(l.t).replace(/<[^>]+>/g,'')}</span></div>`;
  }).reverse().join('');
}
</script>
</body>
</html>
