<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Converter — Exact Age Calculator</title>
<meta name="description" content="Calculate exact age in years, months, days, hours, and minutes from any birth date.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Cpath d='M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32' fill='none' stroke='%2300e5ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%2300e5ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3a;--accent:#00e5ff;--accent2:#7c3aed;--text:#e8e8f0;--muted:#6b6b88}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.logo-mark{width:28px;height:28px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,229,255,.25)}
.logo-mark svg{width:100%;height:100%;display:block}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.78rem}
.nav-links a:hover{color:var(--text)}
.main{max-width:640px;margin:0 auto;padding:2.5rem 1.25rem 3rem;position:relative;z-index:1}
.hero-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em;margin-bottom:.4rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:2rem;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.75rem .9rem;border-radius:8px;font-family:'DM Mono',monospace;font-size:.9rem;outline:none;color-scheme:dark}
.field input:focus{border-color:var(--accent)}
.results{margin-top:1.25rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.55rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;color:var(--accent);line-height:1.1}
.stat-label{font-size:.68rem;color:var(--muted);margin-top:.35rem;text-transform:uppercase;letter-spacing:.06em}
.detail{margin-top:1rem;font-size:.78rem;color:var(--muted);line-height:1.6;text-align:center}
footer{text-align:center;padding:1.25rem;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">
    <div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0f"/><path d="M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="32" r="4" fill="#00e5ff"/></svg></div>
    Web<span>Gadgets</span>
  </a>
  <div class="nav-links"><a href="/">All tools</a><a href="mailto:jaredwang107@gmail.com">Contact</a></div>
</nav>
<main class="main">
  <div class="hero-label">Free online tool</div>
  <h1>Age Converter</h1>
  <p class="sub">Enter a birth date to get your exact age in years, months, days, hours, and more.</p>
  <div class="panel">
    <div class="field">
      <label>Birth date</label>
      <input type="date" id="birth" max="">
    </div>
    <div class="field">
      <label>As of (optional)</label>
      <input type="date" id="asof">
    </div>
    <div class="results" id="results"></div>
    <div class="detail" id="detail"></div>
  </div>
</main>
<footer><a href="/">WebGadgets</a> · Free tools, no ads</footer>
<script>
const birth = document.getElementById('birth');
const asof = document.getElementById('asof');
const results = document.getElementById('results');
const detail = document.getElementById('detail');
const today = new Date();
const iso = d => d.toISOString().slice(0,10);
birth.max = iso(today);
asof.value = iso(today);
asof.max = iso(today);

function calc() {
  results.innerHTML = '';
  detail.textContent = '';
  if (!birth.value) return;
  const start = new Date(birth.value + 'T00:00:00');
  const end = new Date((asof.value || iso(today)) + 'T00:00:00');
  if (end < start) {
    detail.textContent = 'As-of date must be on or after the birth date.';
    return;
  }
  let y = end.getFullYear() - start.getFullYear();
  let m = end.getMonth() - start.getMonth();
  let d = end.getDate() - start.getDate();
  if (d < 0) {
    m--;
    const prev = new Date(end.getFullYear(), end.getMonth(), 0);
    d += prev.getDate();
  }
  if (m < 0) { y--; m += 12; }

  const ms = end - start;
  const totalDays = Math.floor(ms / 86400000);
  const totalHours = Math.floor(ms / 3600000);
  const totalMins = Math.floor(ms / 60000);
  const totalWeeks = Math.floor(totalDays / 7);
  const totalMonthsApprox = y * 12 + m;

  const stats = [
    [y, 'Years'],
    [m, 'Months'],
    [d, 'Days'],
    [totalWeeks, 'Total weeks'],
    [totalDays, 'Total days'],
    [totalHours.toLocaleString(), 'Total hours'],
    [totalMins.toLocaleString(), 'Total minutes'],
    [totalMonthsApprox, 'Total months']
  ];
  for (const [v, l] of stats) {
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `<div class="stat-val">${v}</div><div class="stat-label">${l}</div>`;
    results.appendChild(el);
  }
  detail.textContent = `Exact age: ${y} years, ${m} months, ${d} days`;
}
birth.addEventListener('change', calc);
asof.addEventListener('change', calc);
</script>
</body>
</html>
