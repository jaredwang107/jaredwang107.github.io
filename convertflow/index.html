<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConvertFlow — File Converter</title>
  <meta name="description" content="Convert files between 900+ formats. Images, video, audio, documents, and more — free, no sign-up.">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/convertflow.css">
  <link rel="stylesheet" href="/css/support.css">
</head>
<body class="page-convertflow">

  <div data-include="/partials/site-header.html"></div>

  <main class="page-content page-content--hero">
    <section class="converter-panel" aria-label="File converter">
      <div class="drop-zone" id="dropZone">
        <span class="drop-icon">⇄</span>
        <h1 class="drop-title">Drop any file here</h1>
        <p class="drop-sub">or <span>browse</span> to upload · up to <span>2 GB</span></p>
        <button type="button" class="btn-browse" onclick="document.getElementById('fileInput').click()">Choose Files</button>
        <input type="file" id="fileInput" multiple>
      </div>

      <p class="format-tagline">
        <span id="formatTaglineCats"></span> and more — free, no sign-up
      </p>

      <div class="format-explorer" id="formatExplorer" hidden>
        <div id="formatPanels"></div>
      </div>

      <div class="file-list" id="fileList"></div>
      <button type="button" class="btn-convert" id="convertBtn" onclick="startConvert()">Convert All Files</button>
      <div class="status-msg" id="statusMsg"></div>
    </section>
  </main>

  <div class="page-footer" data-include="/partials/site-footer.html"></div>

  <script src="/js/include.js"></script>
  <script src="/js/categories.js"></script>
  <script src="/js/formats-browser.js"></script>
  <script src="/js/convertflow.js"></script>
</body>
</html>
