<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Counter — Words, Chars, Sentences</title>
<meta name="description" content="Free character counter. Count characters, words, sentences, paragraphs, and reading time.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Cpath d='M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32' fill='none' stroke='%2300e5ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%2300e5ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3a;--accent:#00e5ff;--accent2:#7c3aed;--text:#e8e8f0;--muted:#6b6b88}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem}
.logo span{color:var(--accent)}
.logo-mark{width:28px;height:28px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,229,255,.25);flex-shrink:0}
.logo-mark svg{width:100%;height:100%;display:block}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.78rem;margin-left:1.25rem}
.nav-links a:hover{color:var(--text)}
.main{max-width:720px;margin:0 auto;padding:2.5rem 1.25rem 3rem;position:relative;z-index:1}
.hero-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.03em;margin-bottom:.4rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:1.75rem;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.35rem}
textarea{width:100%;min-height:220px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:1rem;border-radius:10px;font-family:'DM Mono',monospace;font-size:.9rem;line-height:1.6;outline:none;resize:vertical}
textarea:focus{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.55rem;margin-top:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-align:center}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;color:var(--accent)}
.stat-label{font-size:.65rem;color:var(--muted);margin-top:.3rem;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap;align-items:center}
.row label{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.limit{margin-top:.75rem;font-size:.75rem;color:var(--muted)}
.limit strong{color:var(--accent)}
footer{text-align:center;padding:1.25rem;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">
    <div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0f"/><path d="M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="32" r="4" fill="#00e5ff"/></svg></div>
    Web<span>Gadgets</span>
  </a>
  <div class="nav-links"><a href="/tools.html">Tools</a><a href="mailto:jaredwang107@gmail.com">Contact</a></div>
</nav>
<main class="main">
  <div class="hero-label">Free online tool</div>
  <h1>Character Counter</h1>
  <p class="sub">Count characters, words, sentences, paragraphs, and estimated reading time as you type.</p>
  <div class="panel">
    <textarea id="text" placeholder="Paste or type your text here…" spellcheck="true"></textarea>
    <div class="row">
      <label><input type="checkbox" id="trim" checked> Ignore leading/trailing spaces for char count</label>
    </div>
    <div class="stats" id="stats"></div>
    <div class="limit" id="limit"></div>
  </div>
</main>
<footer><a href="/tools.html">All tools</a> · WebGadgets</footer>
<script>
const ta=document.getElementById('text'), trimEl=document.getElementById('trim'), stats=document.getElementById('stats'), limit=document.getElementById('limit');
function count(){
  const raw=ta.value;
  const t=trimEl.checked?raw.trim():raw;
  const chars=t.length;
  const charsNoSpace=t.replace(/\s/g,'').length;
  const words=(t.match(/\S+/g)||[]).length;
  const sentences=(t.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g)||[]).filter(s=>s.trim()).length;
  const paras=(t.split(/\n\s*\n/).filter(p=>p.trim())).length || (t.trim()?1:0);
  const lines=raw===''?0:raw.split(/\n/).length;
  const readMin=words/200;
  const readStr=readMin<1?(Math.round(readMin*60)+' sec'):(readMin.toFixed(1)+' min');
  const items=[['Characters',chars],['No spaces',charsNoSpace],['Words',words],['Sentences',sentences],['Paragraphs',paras],['Lines',lines],['Reading',readStr]];
  stats.innerHTML=items.map(([l,v])=>`<div class="stat"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');
  const targets=[140,280,1000,5000];
  limit.innerHTML='Twitter-ish limits: '+targets.map(n=>{
    const left=n-chars; const c=left<0?'#ef4444':'var(--accent)';
    return `<strong style="color:${c}">${left}</strong> vs ${n}`;
  }).join(' · ');
}
ta.addEventListener('input',count); trimEl.addEventListener('change',count); count();
</script>
</body>
</html>
