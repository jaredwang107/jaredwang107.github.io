<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer — Countdown with Presets</title>
<meta name="description" content="Free countdown timer with presets, custom duration, and alert.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Cpath d='M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32' fill='none' stroke='%2300e5ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%2300e5ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3a;--accent:#00e5ff;--accent2:#7c3aed;--text:#e8e8f0;--muted:#6b6b88;--danger:#ef4444}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem}
.logo span{color:var(--accent)}
.logo-mark{width:28px;height:28px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,229,255,.25)}
.logo-mark svg{width:100%;height:100%}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.78rem;margin-left:1.25rem}
.main{max-width:480px;margin:0 auto;padding:2.5rem 1.25rem 3rem;position:relative;z-index:1;text-align:center}
.hero-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:.35rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:1.75rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem}
.time{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.8rem,10vw,3.6rem);letter-spacing:-.03em;color:var(--accent);margin:1rem 0;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:1rem}
.preset{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:.4rem .75rem;border-radius:100px;font-size:.72rem;cursor:pointer;font-family:'DM Mono',monospace}
.preset:hover,.preset.active{border-color:var(--accent);color:var(--accent)}
.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:1rem}
.inputs label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inputs input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.6rem;border-radius:8px;font-family:'DM Mono',monospace;font-size:1rem;text-align:center;outline:none}
.inputs input:focus{border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.85rem;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;color:#fff}
.btn.danger{color:var(--danger)}
.status{margin-top:1rem;font-size:.78rem;color:var(--muted);min-height:1.2em}
.status.done{color:var(--accent)}
footer{text-align:center;padding:1.25rem;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0f"/><path d="M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="32" r="4" fill="#00e5ff"/></svg></div>Web<span>Gadgets</span></a>
  <div class="nav-links"><a href="/tools.html">Tools</a><a href="mailto:jaredwang107@gmail.com">Contact</a></div>
</nav>
<main class="main">
  <div class="hero-label">Free online tool</div>
  <h1>Timer</h1>
  <p class="sub">Countdown with presets and custom duration.</p>
  <div class="panel">
    <div class="presets" id="presets">
      <button class="preset" data-s="60">1 min</button>
      <button class="preset" data-s="300">5 min</button>
      <button class="preset active" data-s="600">10 min</button>
      <button class="preset" data-s="1500">25 min</button>
      <button class="preset" data-s="3600">1 hour</button>
    </div>
    <div class="time" id="display">10:00</div>
    <div class="inputs">
      <div><label>Hours</label><input id="h" type="number" min="0" max="99" value="0"></div>
      <div><label>Minutes</label><input id="m" type="number" min="0" max="59" value="10"></div>
      <div><label>Seconds</label><input id="s" type="number" min="0" max="59" value="0"></div>
    </div>
    <div class="btns">
      <button class="btn danger" id="reset">Reset</button>
      <button class="btn primary" id="toggle">Start</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</main>
<footer><a href="/tools.html">All tools</a> · WebGadgets</footer>
<script>
let total=600, left=600, timer=null, running=false;
const display=document.getElementById('display'), status=document.getElementById('status');
const hIn=document.getElementById('h'), mIn=document.getElementById('m'), sIn=document.getElementById('s');
function fmt(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function syncInputs(){hIn.value=Math.floor(left/3600);mIn.value=Math.floor((left%3600)/60);sIn.value=left%60;display.textContent=fmt(left);}
function readInputs(){total=left=(+hIn.value||0)*3600+(+mIn.value||0)*60+(+sIn.value||0);display.textContent=fmt(left);}
document.getElementById('presets').onclick=e=>{
  const b=e.target.closest('.preset'); if(!b)return;
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active')); b.classList.add('active');
  if(running)return; total=left=+b.dataset.s; syncInputs(); status.textContent='';
};
[hIn,mIn,sIn].forEach(el=>el.addEventListener('change',()=>{if(!running){readInputs();document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));}}));
document.getElementById('toggle').onclick=()=>{
  if(!running){
    if(left<=0)readInputs(); if(left<=0)return;
    running=true; document.getElementById('toggle').textContent='Pause'; status.textContent='Running…';
    timer=setInterval(()=>{
      left--; display.textContent=fmt(left);
      if(left<=0){clearInterval(timer);running=false;document.getElementById('toggle').textContent='Start';
        status.textContent='Time’s up!'; status.className='status done';
        try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2Onp2B').play()}catch(e){}
        if(navigator.vibrate)navigator.vibrate([200,100,200]);}
    },1000);
  } else { clearInterval(timer); running=false; document.getElementById('toggle').textContent='Start'; status.textContent='Paused'; }
};
document.getElementById('reset').onclick=()=>{
  clearInterval(timer); running=false; left=total; syncInputs();
  document.getElementById('toggle').textContent='Start'; status.textContent=''; status.className='status';
};
syncInputs();
</script>
</body>
</html>
