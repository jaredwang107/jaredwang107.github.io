<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Converter — Binary, Octal, Decimal, Hex</title>
<meta name="description" content="Free number base converter. Binary, octal, decimal, hexadecimal and more.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Cpath d='M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32' fill='none' stroke='%2300e5ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='32' r='4' fill='%2300e5ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a26;--border:#2a2a3a;--accent:#00e5ff;--accent2:#7c3aed;--text:#e8e8f0;--muted:#6b6b88;--danger:#ef4444}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.logo-mark{width:28px;height:28px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,229,255,.25)}
.logo-mark svg{width:100%;height:100%;display:block}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.78rem}
.nav-links a:hover{color:var(--text)}
.main{max-width:640px;margin:0 auto;padding:2.5rem 1.25rem 3rem;position:relative;z-index:1}
.hero-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.03em;margin-bottom:.4rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:2rem;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.75rem .9rem;border-radius:8px;font-family:'DM Mono',monospace;font-size:.9rem;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.results{margin-top:1.25rem;display:grid;gap:.55rem}
.res-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem}
.res-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.res-val{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;color:var(--accent);word-break:break-all;text-align:right}
.err{color:var(--danger);font-size:.78rem;margin-top:.5rem;display:none}
footer{text-align:center;padding:1.25rem;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">
    <div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0f"/><path d="M12 32 L20 32 L26 48 L34 16 L42 40 L50 32 L52 32" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="32" r="4" fill="#00e5ff"/></svg></div>
    Web<span>Gadgets</span>
  </a>
  <div class="nav-links"><a href="/">All tools</a><a href="mailto:jaredwang107@gmail.com">Contact</a></div>
</nav>
<main class="main">
  <div class="hero-label">Free online tool</div>
  <h1>Number Converter</h1>
  <p class="sub">Convert between binary, octal, decimal, hexadecimal, and other bases.</p>
  <div class="panel">
    <div class="row">
      <div class="field">
        <label>From base</label>
        <select id="fromBase">
          <option value="2">Binary (2)</option>
          <option value="8">Octal (8)</option>
          <option value="10" selected>Decimal (10)</option>
          <option value="16">Hexadecimal (16)</option>
          <option value="3">Base 3</option>
          <option value="4">Base 4</option>
          <option value="5">Base 5</option>
          <option value="6">Base 6</option>
          <option value="7">Base 7</option>
          <option value="9">Base 9</option>
          <option value="12">Base 12</option>
          <option value="32">Base 32</option>
          <option value="36">Base 36</option>
        </select>
      </div>
      <div class="field">
        <label>Input</label>
        <input id="input" type="text" placeholder="Enter a number" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="err" id="err">Invalid number for selected base.</div>
    <div class="results" id="results"></div>
  </div>
</main>
<footer><a href="/">WebGadgets</a> · Free tools, no ads</footer>
<script>
const bases = [
  [2,'Binary'],[8,'Octal'],[10,'Decimal'],[16,'Hex'],
  [3,'Base 3'],[4,'Base 4'],[5,'Base 5'],[6,'Base 6'],[7,'Base 7'],
  [9,'Base 9'],[12,'Base 12'],[32,'Base 32'],[36,'Base 36']
];
const input = document.getElementById('input');
const fromBase = document.getElementById('fromBase');
const results = document.getElementById('results');
const err = document.getElementById('err');

function convert() {
  const raw = input.value.trim().replace(/\s+/g,'');
  results.innerHTML = '';
  err.style.display = 'none';
  if (!raw) return;
  const fb = parseInt(fromBase.value, 10);
  let n;
  try {
    n = parseInt(raw, fb);
    if (isNaN(n) || !isFinite(n)) throw 0;
    // validate digits belong to base
    const valid = raw.replace(/^-/,'').toUpperCase();
    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.slice(0, fb);
    for (const c of valid) if (!chars.includes(c)) throw 0;
  } catch {
    err.style.display = 'block';
    return;
  }
  for (const [b, name] of bases) {
    const row = document.createElement('div');
    row.className = 'res-row';
    row.innerHTML = `<span class="res-label">${name} (${b})</span><span class="res-val">${n.toString(b).toUpperCase()}</span>`;
    results.appendChild(row);
  }
}
input.addEventListener('input', convert);
fromBase.addEventListener('change', convert);
</script>
</body>
</html>
